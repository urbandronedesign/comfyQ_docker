# RunPod GPU stock, recorded every 15 minutes (RunPod keeps no history).
# Readings go to the `runpod-stock` branch, never to main, so they neither
# clutter its history nor trigger anything. The RunPod console's Stock tab
# reads them from there. Needs the repository secret RUNPOD_API_KEY_READONLY:
# a READ-ONLY RunPod key (Settings → API Keys), which cannot create Pods.
# ★ GitHub's scheduler is best-effort: a new cron starts late and busy-hour
#   triggers are delayed or dropped (on 2026-10-19 the first three 15-minute
#   slots never fired). So a run does not take one reading and exit: it stays
#   up for ~5h45m and reads at :07/:22/:37/:52 itself. The hourly trigger only
#   has to land once every ~6 hours, and as a backstop each run that read for
#   its full stretch starts the next one itself (last step). A newer run waits
#   for the current one, and a reading under 10 min old is not repeated.
# ⚠ GitHub pauses scheduled workflows in a repository with no activity for
#   60 days; re-enable it from the Actions tab if that happens.
name: RunPod stock

on:
  schedule:
    - cron: '3 * * * *'   # hourly wake-up; the run itself reads every 15 min
  workflow_dispatch:

concurrency:
  group: runpod-stock
  # A new run waits for the current one to finish rather than cutting it off;
  # it then skips any slot the old run already read.
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # lets a finishing run start its successor (see the last step)

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Code (for the recorder)
        uses: actions/checkout@v4
        with:
          path: code

      - name: Data branch
        run: |
          set -e
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" runpod-stock >/dev/null 2>&1; then
            git clone --depth 1 --branch runpod-stock "$url" data
          else
            # First run: an empty branch with nothing but the readings.
            mkdir data && cd data && git init -q -b runpod-stock && git remote add origin "$url"
            printf '# RunPod GPU stock readings\n\nWritten every 15 minutes by .github/workflows/runpod-stock.yml on main.\nOne JSON line per reading in stock/YYYY-MM.jsonl; see tools/runpod/stock-recorder.mjs.\n' > README.md
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read every 15 minutes, for up to ~5h45m
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY_READONLY }}
        run: |
          # Not set up yet: say so once per run, without failing (and emailing).
          if [ -z "$RUNPOD_API_KEY" ]; then
            echo "::warning::Secret RUNPOD_API_KEY_READONLY is not set — no reading taken. See tools/runpod/README.md, 'Stock history'."
            exit 0
          fi
          echo "LOOPED=1" >> "$GITHUB_ENV"
          echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
          cd data
          git config user.name "runpod-stock-bot"
          git config user.email "runpod-stock-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 345*60 ))
          while :; do
            git pull -q --rebase origin runpod-stock 2>/dev/null || true
            # Skip if the last reading is under 10 minutes old (a run that just
            # took over from another must not record the same slot twice).
            last=$(cat stock/*.jsonl 2>/dev/null | tail -n 1 | sed -n 's/^{"at":"\([^"]*\)".*/\1/p')
            age=999999
            [ -n "$last" ] && age=$(( $(date +%s) - $(date -d "$last" +%s) ))
            if [ "$age" -ge 600 ]; then
              if node ../code/tools/runpod/stock-recorder.mjs --out stock; then
                git add -A
                git commit -q -m "stock $(date -u +%FT%TZ)" || true
                git push -q origin runpod-stock || (git pull -q --rebase origin runpod-stock && git push -q origin runpod-stock) || echo "::warning::push failed; will retry with the next reading"
              else
                echo "::warning::reading failed at $(date -u +%T); trying again next slot"
              fi
            else
              echo "last reading ${age}s old — skipping this slot"
            fi
            # Sleep to the next :07/:22/:37/:52 (UTC).
            now=$(date +%s); m=$(( (now/60) % 60 )); s=$(( now % 60 ))
            next=7; for t in 7 22 37 52 67; do if [ $m -lt $t ]; then next=$t; break; fi; done
            wait=$(( (next - m)*60 - s ))
            [ $(( $(date +%s) + wait )) -ge $end ] && break
            sleep "$wait"
          done

      # GitHub's schedule is best-effort and can go hours without firing, so a
      # run that read for its full stretch starts the next one itself. Not after
      # a short run (a crash must not become an endless chain of quick runs),
      # not without the key, not when cancelled. To stop the chain: Actions →
      # RunPod stock → ⋯ → Disable workflow.
      - name: Hand over to the next run
        if: (success() || failure()) && env.LOOPED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ran=$(( $(date +%s) - $STARTED ))
          if [ "$ran" -lt 3600 ]; then
            echo "::warning::This run only read for $(( ran / 60 )) min — not starting another; the hourly schedule will."
            exit 0
          fi
          gh workflow run runpod-stock.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
          echo "Next run requested; it starts as soon as this one ends."
